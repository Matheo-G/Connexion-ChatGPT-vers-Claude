<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mathéo AI Router</title>
    <link rel="stylesheet" href="../ui-kit/tokens.css" />
    <link rel="stylesheet" href="../ui-kit/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup fade-in">
      <header class="brand">
        <span class="brand__mark" data-icon="logo"></span>
        <div>
          <h1 class="brand__name" data-i18n="extName">Mathéo AI Router</h1>
          <p class="brand__subtitle" data-i18n="popupSubtitle">Orchestrateur d'IA</p>
        </div>
        <button class="icon-button" id="open-options" type="button" data-icon="settings" aria-label="Réglages"></button>
      </header>

      <section class="section">
        <h2 class="section__title" data-i18n="popupConnections">Connexions</h2>
        <ul class="card provider-list" id="provider-list" aria-live="polite"></ul>
      </section>

      <section class="section">
        <h2 class="section__title" data-i18n="popupDiagnostics">Diagnostic</h2>
        <div class="actions">
          <button class="button button--primary" id="test-target" type="button">
            <span class="button__icon" data-icon="refresh"></span>
            <span class="button__label"></span>
          </button>
          <button class="button button--ghost" id="open-target" type="button">
            <span class="button__icon" data-icon="externalLink"></span>
            <span class="button__label"></span>
          </button>
          <button class="button button--ghost button--wide" id="insert-test" type="button">
            <span class="button__icon" data-icon="send"></span>
            <span class="button__label"></span>
          </button>
          <button class="button button--ghost button--wide" id="read-source" type="button">
            <span class="button__icon" data-icon="sparkles"></span>
            <span class="button__label"></span>
          </button>
          <button class="button button--link button--wide" id="diagnose-source" type="button">
            <span class="button__icon" data-icon="code" data-icon-size="14"></span>
            <span class="button__label"></span>
          </button>
        </div>
        <p class="feedback" id="feedback" role="status" hidden></p>
        <div class="preview" id="preview" hidden>
          <pre class="preview__text" id="preview-text" tabindex="0"></pre>
          <button class="button button--ghost preview__copy" id="copy-preview" type="button">
            <span class="button__icon" data-icon="copy" data-icon-size="14"></span>
            <span class="button__label"></span>
          </button>
        </div>
      </section>

      <footer class="muted" id="version"></footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
