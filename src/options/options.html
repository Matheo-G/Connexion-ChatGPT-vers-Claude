<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Réglages · Mathéo AI Router</title>
    <link rel="stylesheet" href="../ui-kit/tokens.css" />
    <link rel="stylesheet" href="../ui-kit/base.css" />
    <link rel="stylesheet" href="../ui-kit/controls.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="options fade-in">
      <header class="options__header">
        <div class="brand">
          <span class="brand__mark" data-icon="logo"></span>
          <div>
            <h1 class="brand__name" data-i18n="extName">Mathéo AI Router</h1>
            <p class="brand__subtitle" data-i18n="optionsSubtitle">Réglages de l'extension</p>
          </div>
        </div>
        <p class="saved" id="saved" role="status" aria-live="polite">
          <span data-icon="check" data-icon-size="14"></span><span data-i18n="saved">Enregistré</span>
        </p>
      </header>

      <!-- Sections are rendered from settings-schema.js -->
      <div class="sections" id="sections"></div>

      <footer class="muted" id="version"></footer>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
