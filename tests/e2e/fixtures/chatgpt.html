<!doctype html>
<!--
  Stand-in for chatgpt.com: a conversation whose DOM mirrors ChatGPT's
  (turn articles, data-message-author-role, ".markdown" content, code block
  header with "Copier le code", citation pills, KaTeX, action bar, composer
  with stop/send button).

  Two layouts, like the real site (served per account):
    default            classic "author-role" layout (article turns, .markdown);
    layout: 'turn-key' "Chat / Work" layout rolled out from Sept. 2026
                       ([data-turn-key] items, user bubble, reply id, no .markdown,
                       math as data-math-source, stop button without data-testid).
                       Also reproduces its traps: an earlier conversation kept in
                       the page under display:none (after the visible one), and
                       `duplicate: true` renders the thread twice.

  Scenario knobs (window.__FIXTURE__, injected by the harness):
    empty      no conversation yet
    streaming  the last answer is being written; finishes after `streamMs`
               (omit streamMs to stream forever)
    stopButton false: (turn-key) no stop button, only the turn state says "streaming"
    split      the last turn holds two assistant messages (around a tool call)
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT (fixture)</title>
    <style>
      body { font-family: system-ui; margin: 2rem; max-width: 760px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      article { border-bottom: 1px solid #eee; padding: 12px 0; }
      pre { background: #f4f4f4; padding: 8px; border-radius: 8px; }
      .actions button { font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div id="thread"></div>
      <form id="composer" data-chatgpt-composer="">
        <div id="prompt-textarea" contenteditable="true"></div>
        <button id="composer-button" type="button" data-testid="send-button" aria-label="Envoyer le prompt">↑</button>
      </form>
    </main>

    <template id="rich-answer">
      <h2>Écran de connexion</h2>
      <p>Voici un prompt <strong>optimisé</strong> pour <em>Figma</em>, avec <code>Auto Layout</code>. Source <a href="https://help.figma.com">Figma Help</a><span data-testid="webpage-citation-pill"><a href="https://lemonde.fr">lemonde.fr</a></span>.</p>
      <pre class="overflow-visible!"><div class="contain-inline-size rounded-2xl"><div class="flex items-center">javascript</div><div class="sticky top-9"><button aria-label="Copier"><svg width="10" height="10"></svg>Copier le code</button></div><div class="overflow-y-auto p-4" dir="ltr"><code class="whitespace-pre! language-javascript"><span><span class="hljs-keyword">const</span> frame = figma.<span class="hljs-title">createFrame</span>();
frame.<span class="hljs-property">layoutMode</span> = <span class="hljs-string">"VERTICAL"</span>;</span></code></div></div></pre>
      <ul>
        <li>Champs
          <ul><li>Email</li><li>Mot de passe</li></ul>
        </li>
        <li>Bouton <strong>Continuer</strong></li>
      </ul>
      <table>
        <thead><tr><th>Élément</th><th>Espacement</th></tr></thead>
        <tbody><tr><td>Champ</td><td>16 px</td></tr><tr><td>Bouton</td><td>24 px</td></tr></tbody>
      </table>
      <p>Ratio : <span class="katex"><span class="katex-mathml"><math><semantics><mrow></mrow><annotation encoding="application/x-tex">\frac{16}{9}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true">16/9</span></span></p>
      <blockquote><p>Garde une palette sobre.</p></blockquote>
    </template>

    <!-- Same answer as rendered by the turn-key layout (real markup, Nov. 2026). -->
    <template id="rich-answer-turn-key">
      <h2><span>Écran de connexion</span></h2>
      <p><span>Voici un prompt <strong>optimisé</strong> pour <em>Figma</em>, avec <code>Auto Layout</code>. Source <a href="https://help.figma.com">Figma Help</a><span data-testid="webpage-citation-pill"><a href="https://lemonde.fr">lemonde.fr</a></span>.</span></p>
      <div data-chatgpt-copy-code="x"><div data-code-block="true" data-markdown-copy="code-block" data-theme="dark"><div data-markdown-copy="exclude" contenteditable="false"><svg width="10" height="10"></svg><div class="min-w-0 truncate flex-1">JavaScript</div><div class="ms-auto flex"><div data-code-block-controls="true" role="presentation"><button type="button" aria-label="Copier">Copier</button></div></div></div><div class="relative"><div class="w-full overflow-x-hidden"><div class="relative z-0 flex max-w-full"><pre><code><span>const</span> frame = figma.createFrame();
frame.layoutMode = <span>"VERTICAL"</span>;</code></pre></div></div><button aria-hidden="true" aria-label="Faire défiler jusqu’en bas" type="button"></button></div></div></div>
      <ul><li><span>Champs</span><ul><li><span>Email</span></li><li><span>Mot de passe</span></li></ul></li><li><span>Bouton <strong>Continuer</strong></span></li></ul>
      <div data-markdown-table="true"><div data-horizontal-scroll="true"><div><table><thead><tr><th>Élément</th><th>Espacement</th></tr></thead><tbody><tr><td>Champ</td><td>16 px</td></tr><tr><td>Bouton</td><td>24 px</td></tr></tbody></table></div></div><div data-block-actions="true" data-markdown-copy="exclude"><button type="button" aria-label="Copier le tableau">⧉</button><button type="button" aria-label="Développer le tableau">⤢</button></div></div>
      <p><span>Ratio : <span data-math-source="\frac{16}{9}"><span class="katex"><span class="katex-html" aria-hidden="true">16/9</span></span></span></span></p>
      <blockquote><p><span>Garde une palette sobre.</span></p></blockquote>
    </template>

    <script>
      const cfg = window.__FIXTURE__ || {};
      const thread = document.getElementById('thread');
      let turn = 0;

      function addTurn(role, html, id) {
        turn += 1;
        const article = document.createElement('article');
        article.dataset.testid = `conversation-turn-${turn}`;
        const label = role === 'user' ? 'Vous avez dit :' : 'ChatGPT a dit :';
        const content = role === 'user'
          ? `<div class="whitespace-pre-wrap">${html}</div>`
          : `<div class="markdown prose dark:prose-invert w-full break-words">${html}</div>`;
        article.innerHTML =
          `<h6 class="sr-only">${label}</h6>` +
          `<div data-message-author-role="${role}" data-message-id="${id}">${content}</div>` +
          (role === 'assistant'
            ? '<div class="actions"><button data-testid="copy-turn-action-button" aria-label="Copier">⧉</button><button data-testid="good-response-turn-action-button" aria-label="Bonne réponse">👍</button></div>'
            : '');
        thread.append(article);
        return article;
      }

      function addAssistantPart(article, html, id) {
        const message = document.createElement('div');
        message.dataset.messageAuthorRole = 'assistant';
        message.dataset.messageId = id;
        message.innerHTML = `<div class="markdown prose">${html}</div>`;
        article.querySelector('.actions').before(message);
      }

      function setStreaming(on) {
        const button = document.getElementById('composer-button');
        if (cfg.layout === 'turn-key') delete button.dataset.testid; // no test ids in this layout
        else button.dataset.testid = on ? 'stop-button' : 'send-button';
        button.setAttribute('aria-label', on ? 'Arrêter la génération' : 'Envoyer le prompt');
      }

      // ---- "turn-key" layout ------------------------------------------------
      /**
       * One exchange in the turn-key layout, mirroring the real markup seen in a
       * user diagnostic (Nov. 2026): display:contents wrappers, turn state,
       * response body, assistant-message style, action bar outside the turn body.
       */
      function turnKeyItem(key, prompt, replyHtml, replyId) {
        const item = document.createElement('div');
        item.dataset.turnKey = key;
        const unit = `fallback-turn-${key}`;
        const reply = replyId
          ? `<div data-response-body="${replyId}"><div data-chatgpt-selection-message-id="${replyId}" class="group flex min-w-0 flex-col">` +
            `<div data-markdown-text-style="assistant-message">${replyHtml}</div></div></div>`
          : `<div class="streaming-reply"><div data-markdown-text-style="assistant-message">${replyHtml}</div></div>`;
        item.innerHTML =
          `<div data-content-search-turn-key="${unit}"><div class="flex flex-col gap-1.5">` +
          `<div data-talvt-turn-state="${replyId ? 'complete' : 'streaming'}" class="group flex flex-col">` +
          '<div data-spacing="activity">' +
          '<div style="display:contents">' +
          '<h4 class="sr-only" data-conversation-role="user">Vous avez dit :</h4>' +
          `<div data-chatgpt-search-unit-key="${unit}:0:user" data-chatgpt-search-message-ids="${key}">` +
          `<div data-content-search-unit-key="${unit}:0:user"><div>` +
          `<div data-user-message-bubble="true"><div class="whitespace-pre-wrap">${prompt}</div></div>` +
          '<div><button type="button" aria-label="Copier le message">⧉</button><button type="button" aria-label="Modifier le message">✎</button></div>' +
          '</div></div></div></div>' +
          '<div style="display:contents"><span hidden data-chatgpt-agent-turn-start></span>' +
          `<div data-content-search-unit-key="${unit}:1:assistant" data-chatgpt-search-message-ids="${replyId ?? ''}">` +
          '<h4 class="sr-only" data-conversation-role="assistant">ChatGPT a dit :</h4>' +
          reply +
          '</div></div></div></div>' +
          (replyId
            ? '<div class="mt-1.5 flex turn-action-controls"><div class="flex items-center gap-0.5">' +
              '<button type="button" aria-label="Copier">⧉</button>' +
              '<button type="button" aria-label="Évaluer la réponse">👍</button>' +
              '<button type="button" aria-label="Lire à voix haute">🔊</button>' +
              '<button type="button" aria-label="Partager">↗</button>' +
              '<button type="button" aria-label="Autres actions">…</button>' +
              '</div></div>'
            : '') +
          '</div></div>';
        return item;
      }

      function renderTurnKey() {
        const rich = document.getElementById('rich-answer-turn-key').innerHTML;
        const target = document.createElement('div');
        target.setAttribute('data-chatgpt-conversation-selection-target', '');
        const list = document.createElement('div');
        target.append(list);
        thread.append(target);

        list.append(turnKeyItem('u1', 'Bonjour', '<p>Première réponse.</p>', 'a1'));
        if (cfg.streaming) {
          list.append(turnKeyItem('u2', '/figma Crée un écran de connexion', '<p>Écran de con</p>', null));
          if (cfg.stopButton !== false) setStreaming(true);
        } else {
          list.append(turnKeyItem('u2', '/figma Crée un écran de connexion', rich, 'a2'));
        }
        if (cfg.duplicate) thread.append(target.cloneNode(true));

        // An earlier conversation, kept hidden by ChatGPT — placed last on purpose.
        const cached = document.createElement('main');
        cached.style.display = 'none';
        cached.append(turnKeyItem('old', 'Ancienne question', '<p>Ancienne conversation.</p>', 'old-a'));
        document.body.append(cached);
      }

      if (cfg.layout === 'turn-key') {
        if (!cfg.empty) renderTurnKey();
      } else if (!cfg.empty) {
        addTurn('user', 'Bonjour', 'u1');
        addTurn('assistant', '<p>Première réponse.</p>', 'a1');
        addTurn('user', '/figma Crée un écran de connexion', 'u2');
        const rich = document.getElementById('rich-answer').innerHTML;

        if (cfg.split) {
          const article = addTurn('assistant', '<p>Je cherche des références…</p>', 'a2-part1');
          addAssistantPart(article, rich, 'a2-part2');
        } else if (cfg.streaming) {
          const article = addTurn('assistant', '<p>Écran de con</p>', 'a2');
          article.querySelector('.markdown').classList.add('result-streaming');
          setStreaming(true);
          if (cfg.streamMs) {
            setTimeout(() => {
              const markdown = article.querySelector('.markdown');
              markdown.innerHTML = rich;
              markdown.classList.remove('result-streaming');
              setStreaming(false);
            }, cfg.streamMs);
          }
        } else {
          addTurn('assistant', rich, 'a2');
        }
      }
    </script>
  </body>
</html>
